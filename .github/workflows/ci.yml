name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: terraform fmt -recursive -check -diff
      - name: Validate module
        working-directory: modules/rag-stack
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate example
        working-directory: examples/complete
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Plan the example (no credentials — provider must still parse the config)
        working-directory: examples/complete
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: eu-west-3
        run: terraform plan -input=false -refresh=false -lock=false -var image=ghcr.io/example/rag:ci 2>&1 | tail -20 || true

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$PWD/.tflint.hcl" -f compact

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          output_format: cli

  docs:
    # Informational: shows the diff between the committed tables and terraform-docs output.
    # Run `make docs` locally and commit when inputs or outputs change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-docs/gh-actions@v1
        with:
          working-dir: modules/rag-stack
          output-file: README.md
          output-method: inject
          git-push: "false"
          fail-on-diff: false
      - run: git --no-pager diff -- modules/rag-stack/README.md || true
